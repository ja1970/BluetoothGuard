name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Create App
        run: |
          rm -rf app android bluetooth-forget-alert.zip || true
          npm init -y
          npm install expo@~51.0.0 react@18.2.0 react-native@0.74.5 --legacy-peer-deps
          mkdir -p assets
          echo '{"expo":{"name":"حارس البلوتوث","slug":"bluetooth-guard","version":"1.0.0","android":{"package":"com.ja1970.bluetoothguard","versionCode":1}}}' > app.json
          echo "import {View,Text,TouchableOpacity,StyleSheet} from 'react-native'; export default function App(){return <View style={s.c}><Text style={s.t}>🛡️ حارس البلوتوث</Text><TouchableOpacity style={s.b}><Text style={s.bt}>جاهز لجوجل بلاي</Text></TouchableOpacity></View>} const s=StyleSheet.create({c:{flex:1,backgroundColor:'#0a0f1e',alignItems:'center',justifyContent:'center'},t:{color:'#fff',fontSize:26,fontWeight:'800'},b:{backgroundColor:'#3B82F6',padding:18,borderRadius:14,marginTop:20},bt:{color:'#fff'}});" > App.js
          npx expo prebuild --platform android --non-interactive
      - name: Build
        run: |
          cd android
          chmod +x gradlew
         ./gradlew bundleRelease
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-guard-aab
          path: android/app/build/outputs/bundle/release/*.aab
