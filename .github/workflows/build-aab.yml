name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build fresh app
        run: |
          rm -rf android app bluetooth-forget-alert.zip || true
          npx -y create-expo-app@latest temp-app --template blank --no-install
          mv temp-app/*./
          mv temp-app/.*./ 2>/dev/null || true
          rm -rf temp-app
          npm install --legacy-peer-deps
          npm install expo-device expo-notifications --legacy-peer-deps
          npx expo prebuild --platform android --non-interactive
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
         ./gradlew bundleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-guard-aab
          path: android/app/build/outputs/bundle/release/*.aab
